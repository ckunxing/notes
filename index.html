<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我的笔记</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<style>
:root{
  --bg:#f4f4f2; --card:#ffffff; --line:#e7e7e4;
  --text:#26262a; --dim:#8a8a90; --accent:#5c6b7a; --accent-soft:#eef0f1;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.04);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#141516; --card:#1d1e20; --line:#2e3033;
    --text:#e2e2e4; --dim:#8e9095; --accent:#9aa7b3; --accent-soft:#26282b;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}

header{position:sticky;top:0;z-index:20;
  background:color-mix(in srgb,var(--bg) 85%,transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  padding:calc(12px + env(safe-area-inset-top)) 20px 12px;border-bottom:1px solid var(--line)}
.h-in{max-width:640px;margin:0 auto}
.h-row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.logo{width:28px;height:28px;border-radius:8px;background:var(--text);color:var(--bg);
  display:flex;align-items:center;justify-content:center;font-size:13px;flex:0 0 auto}
h1{font-size:17px;font-weight:600;margin:0}
.cnt{margin-left:auto;font-size:12px;color:var(--dim)}
.search-wrap{position:relative}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);
  width:15px;height:15px;stroke:var(--dim);fill:none;stroke-width:2.2;pointer-events:none}
#search{width:100%;padding:9px 14px 9px 36px;border-radius:10px;
  border:1px solid var(--line);background:var(--card);color:var(--text);
  font-size:15px;outline:none;transition:border-color .15s}
#search:focus{border-color:var(--accent)}
#search::placeholder{color:var(--dim)}

main{max-width:640px;margin:0 auto;padding:14px 20px 60px}
.note-item{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:15px 17px;margin-bottom:10px;box-shadow:var(--shadow);cursor:pointer}
.note-item:active{opacity:.65}
.ni-head{display:flex;align-items:center;gap:10px}
.ni-title{font-size:16px;font-weight:600;flex:1;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.ni-arrow{color:var(--dim);font-size:16px;flex:0 0 auto;opacity:.5}
.ni-excerpt{font-size:13px;color:var(--dim);margin:6px 0 0;line-height:1.7;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ni-date{display:inline-block;margin-top:9px;font-size:12px;color:var(--dim);
  font-variant-numeric:tabular-nums}
.empty{text-align:center;color:var(--dim);padding:80px 20px;font-size:15px}

#reader{display:none}
.back{display:inline-block;margin:2px 0 12px;color:var(--accent);
  font-size:14px;font-weight:500;cursor:pointer}
.back::before{content:"‹ "}
#content{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:22px 20px;overflow-wrap:break-word;box-shadow:var(--shadow)}
#content h1{font-size:21px;margin:0 0 6px;font-weight:600;line-height:1.4}
#content h2{font-size:18px;margin:1.6em 0 .6em;font-weight:600;padding-bottom:6px;
  border-bottom:1px solid var(--line)}
#content h3{font-size:16px;margin:1.4em 0 .5em;font-weight:600}
#content p{margin:1em 0}
#content img{max-width:100%;border-radius:8px}
#content pre{background:#2a2b2d;color:#e2e2e4;border-radius:8px;padding:13px 15px;
  overflow-x:auto;font-size:13.5px;line-height:1.7;font-family:ui-monospace,Menlo,Consolas,monospace}
#content code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9em}
#content p code,#content li code{background:var(--accent-soft);
  padding:1px 6px;border-radius:5px}
#content blockquote{margin:1.1em 0;padding:2px 0 2px 14px;
  border-left:2px solid var(--dim);color:var(--dim)}
#content table{border-collapse:collapse;width:100%;font-size:14.5px;margin:1.1em 0}
#content th{background:var(--accent-soft);font-weight:600}
#content th,#content td{border:1px solid var(--line);padding:7px 11px;text-align:left}
#content a{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
#content hr{border:none;border-top:1px solid var(--line);margin:1.8em 0}
#content ul,#content ol{padding-left:1.4em}
#content li{margin:.3em 0}
</style>
</head>
<body>
<header>
  <div class="h-in">
    <div class="h-row">
      <div class="logo">记</div><h1>我的笔记</h1><span class="cnt" id="cnt"></span>
    </div>
    <div class="search-wrap">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="search" type="search" placeholder="搜索笔记…" autocomplete="off">
    </div>
  </div>
</header>
<main>
  <div id="list"></div>
  <div id="reader">
    <span class="back" onclick="closeReader()">返回</span>
    <div id="content"></div>
  </div>
</main>
<script>
let notes=[];
const $=id=>document.getElementById(id);

async function init(){
  try{notes=await (await fetch('notes/index.json?t='+Date.now())).json()}catch(e){notes=[]}
  $('cnt').textContent=notes.length?notes.length+' 篇':'';
  render('');
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function render(q){
  const arr=notes.filter(n=>!q||n.title.toLowerCase().includes(q.toLowerCase()));
  $('list').innerHTML=arr.length?arr.map((n,i)=>
    '<div class="note-item" style="animation-delay:'+Math.min(i*40,300)+'ms" onclick="openNote(\''+encodeURIComponent(n.file)+'\')">'+
    '<div class="ni-head">'+
    '<span class="ni-title">'+esc(n.title)+'</span><span class="ni-arrow">›</span></div>'+
    (n.excerpt?'<p class="ni-excerpt">'+esc(n.excerpt)+'</p>':'')+
    '<span class="ni-date">'+n.date+'</span></div>'
  ).join(''):'<div class="empty">'+(q?'没有找到相关笔记':'还没有笔记，去电脑上写一篇吧')+'</div>';
}
async function openNote(f){
  $('list').style.display='none';$('reader').style.display='block';window.scrollTo(0,0);
  $('content').innerHTML='';
  try{
    const md=await (await fetch('notes/'+f+'?t='+Date.now())).text();
    $('content').innerHTML=window.marked?marked.parse(md):'<pre>'+esc(md)+'</pre>';
  }catch(e){$('content').textContent='加载失败'}
}
function closeReader(){$('reader').style.display='none';$('list').style.display='block'}
$('search').addEventListener('input',e=>render(e.target.value.trim()));
init();
</script>
</body>
</html>
