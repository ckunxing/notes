<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我的笔记</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<style>
:root{
  --bg:#f4f1ea; --card:#ffffff; --card2:#faf8f3; --line:#e8e2d5;
  --text:#221f1a; --dim:#8d8578; --accent:#c8342a;
  --shadow:0 2px 12px rgba(60,45,20,.08);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#131210; --card:#1e1d1a; --card2:#26241f; --line:#33302a;
    --text:#ece7dd; --dim:#98907f; --accent:#e85d50;
    --shadow:0 2px 12px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.8 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
header{position:sticky;top:0;z-index:20;
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.h-title{display:flex;align-items:baseline;gap:8px;margin:0 0 10px}
.h-title h1{font-size:20px;font-weight:800;margin:0}
.h-title h1::before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;
  background:var(--accent);margin-right:8px;transform:translateY(-1px)}
.h-title .cnt{font-size:12px;color:var(--dim)}
#search{width:100%;padding:11px 16px;border-radius:12px;border:1.5px solid var(--line);
  background:var(--card);color:var(--text);font-size:15px;outline:none;box-shadow:var(--shadow)}
#search:focus{border-color:var(--accent)}
#search::placeholder{color:var(--dim)}
main{padding:16px 14px 60px;max-width:680px;margin:0 auto}
.note-item{background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:15px 16px;margin-bottom:12px;box-shadow:var(--shadow);cursor:pointer;
  animation:rise .3s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.note-item h2{font-size:16.5px;font-weight:700;margin:0 0 4px}
.note-item .date{font-size:12.5px;color:var(--dim);font-family:ui-monospace,Menlo,monospace}
.empty{text-align:center;color:var(--dim);padding:70px 20px}
/* reader */
#reader{display:none}
#reader .back{display:inline-block;margin-bottom:14px;padding:8px 16px;border-radius:10px;
  border:1.5px solid var(--line);background:var(--card);color:var(--accent);
  font-size:14px;font-weight:600;cursor:pointer}
#content{background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:20px 18px;box-shadow:var(--shadow);overflow-wrap:break-word}
#content h1,#content h2,#content h3{line-height:1.5;margin:1.2em 0 .6em}
#content h1{font-size:21px}#content h2{font-size:18.5px}#content h3{font-size:16.5px}
#content img{max-width:100%;border-radius:10px}
#content pre{background:var(--card2);border:1px solid var(--line);border-radius:10px;
  padding:12px;overflow-x:auto;font-size:13.5px}
#content code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92em}
#content p code,#content li code{background:var(--card2);padding:2px 6px;border-radius:5px}
#content blockquote{margin:1em 0;padding:8px 14px;border-left:3px solid var(--accent);
  background:var(--card2);border-radius:0 10px 10px 0;color:var(--dim)}
#content table{border-collapse:collapse;width:100%;font-size:14px}
#content th,#content td{border:1px solid var(--line);padding:7px 10px}
#content a{color:var(--accent)}
#content hr{border:none;border-top:1px solid var(--line);margin:1.5em 0}
</style>
</head>
<body>
<header>
  <div class="h-title"><h1>我的笔记</h1><span class="cnt" id="cnt"></span></div>
  <input id="search" type="search" placeholder="搜索标题…" autocomplete="off">
</header>
<main>
  <div id="list"></div>
  <div id="reader">
    <span class="back" onclick="closeReader()">‹ 返回列表</span>
    <div id="content"></div>
  </div>
</main>
<script>
let notes=[];
const $=id=>document.getElementById(id);
async function init(){
  try{
    const r=await fetch('notes/index.json?t='+Date.now());
    notes=await r.json();
  }catch(e){notes=[]}
  render('');
}
function render(q){
  const arr=notes.filter(n=>!q||n.title.toLowerCase().includes(q.toLowerCase()));
  $('cnt').textContent=arr.length+' 篇';
  $('list').innerHTML=arr.length?arr.map((n,i)=>
    '<div class="note-item" style="animation-delay:'+Math.min(i*40,300)+'ms" onclick="openNote(\''+encodeURIComponent(n.file)+'\')">'+
    '<h2>'+esc(n.title)+'</h2><span class="date">'+n.date+'</span></div>'
  ).join(''):'<div class="empty">'+(q?'没有匹配的笔记':'还没有笔记')+'</div>';
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
async function openNote(f){
  $('list').style.display='none';$('reader').style.display='block';
  $('content').innerHTML='加载中…';window.scrollTo(0,0);
  try{
    const r=await fetch('notes/'+f+'?t='+Date.now());
    const md=await r.text();
    $('content').innerHTML=window.marked?marked.parse(md):'<pre>'+esc(md)+'</pre>';
  }catch(e){$('content').textContent='加载失败'}
}
function closeReader(){$('reader').style.display='none';$('list').style.display='block'}
$('search').addEventListener('input',e=>render(e.target.value.trim()));
init();
</script>
</body>
</html>
