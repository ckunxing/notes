<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我的笔记</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<style>
:root{
  --bg:#f7f7f8; --card:#ffffff; --line:#e6e6ea;
  --text:#1d1d1f; --dim:#86868b; --accent:#0066cc;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#000000; --card:#1c1c1e; --line:#38383d;
    --text:#f5f5f7; --dim:#98989d; --accent:#4c9aff;
    color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}

header{position:sticky;top:0;z-index:20;background:var(--bg);
  border-bottom:1px solid var(--line);
  padding:calc(14px + env(safe-area-inset-top)) 20px 12px}
.h-in{max-width:640px;margin:0 auto}
.h-row{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
h1{font-size:20px;font-weight:600;margin:0}
.cnt{font-size:13px;color:var(--dim)}
#search{width:100%;padding:9px 14px;border-radius:10px;border:none;
  background:var(--card);color:var(--text);font-size:15px;outline:none;
  border:1px solid var(--line)}
#search::placeholder{color:var(--dim)}

main{max-width:640px;margin:0 auto;padding:12px 20px 60px}
.note-item{display:flex;align-items:center;justify-content:space-between;gap:16px;
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:15px 16px;margin-bottom:10px;cursor:pointer}
.note-item:active{opacity:.6}
.ni-title{font-size:16px;font-weight:500;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.ni-date{font-size:13px;color:var(--dim);white-space:nowrap;
  font-variant-numeric:tabular-nums}
.empty{text-align:center;color:var(--dim);padding:80px 20px;font-size:15px}

#reader{display:none}
.back{display:inline-block;margin:4px 0 16px;color:var(--accent);font-size:15px;cursor:pointer}
.back::before{content:"‹ ";font-weight:600}
#content{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:22px 20px;overflow-wrap:break-word;font-size:16px}
#content h1{font-size:22px;margin:0 0 4px;font-weight:600}
#content h2{font-size:18px;margin:1.6em 0 .6em;font-weight:600}
#content h3{font-size:16px;margin:1.4em 0 .5em;font-weight:600}
#content p{margin:.9em 0}
#content img{max-width:100%;border-radius:8px}
#content pre{background:#f5f5f7;border-radius:8px;padding:12px 14px;overflow-x:auto;
  font-size:13.5px;line-height:1.6;font-family:ui-monospace,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){#content pre{background:#2c2c2e}}
#content code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9em}
#content p code,#content li code{background:rgba(128,128,128,.12);padding:1px 6px;
  border-radius:5px}
#content blockquote{margin:1em 0;padding:2px 0 2px 14px;border-left:3px solid var(--line);
  color:var(--dim)}
#content table{border-collapse:collapse;width:100%;font-size:14.5px;margin:1em 0}
#content th,#content td{border:1px solid var(--line);padding:7px 11px;text-align:left}
#content a{color:var(--accent);text-decoration:none}
#content hr{border:none;border-top:1px solid var(--line);margin:1.8em 0}
#content ul,#content ol{padding-left:1.4em}
#content li{margin:.3em 0}
</style>
</head>
<body>
<header>
  <div class="h-in">
    <div class="h-row"><h1>我的笔记</h1><span class="cnt" id="cnt"></span></div>
    <input id="search" type="search" placeholder="搜索" autocomplete="off">
  </div>
</header>
<main>
  <div id="list"></div>
  <div id="reader">
    <span class="back" onclick="closeReader()">返回</span>
    <div id="content"></div>
  </div>
</main>
<script>
let notes=[];
const $=id=>document.getElementById(id);
async function init(){
  try{notes=await (await fetch('notes/index.json?t='+Date.now())).json()}catch(e){notes=[]}
  $('cnt').textContent=notes.length?notes.length+' 篇':'';
  render('');
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function render(q){
  const arr=notes.filter(n=>!q||n.title.toLowerCase().includes(q.toLowerCase()));
  $('list').innerHTML=arr.length?arr.map(n=>
    '<div class="note-item" onclick="openNote(\''+encodeURIComponent(n.file)+'\')">'+
    '<span class="ni-title">'+esc(n.title)+'</span>'+
    '<span class="ni-date">'+n.date+'</span></div>'
  ).join(''):'<div class="empty">'+(q?'无结果':'暂无笔记')+'</div>';
}
async function openNote(f){
  $('list').style.display='none';$('reader').style.display='block';window.scrollTo(0,0);
  $('content').innerHTML='';
  try{
    const md=await (await fetch('notes/'+f+'?t='+Date.now())).text();
    $('content').innerHTML=window.marked?marked.parse(md):'<pre>'+esc(md)+'</pre>';
  }catch(e){$('content').textContent='加载失败'}
}
function closeReader(){$('reader').style.display='none';$('list').style.display='block'}
$('search').addEventListener('input',e=>render(e.target.value.trim()));
init();
</script>
</body>
</html>
